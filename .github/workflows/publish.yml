name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'MAGMA-rob/magma-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release version and public main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("The tag must match the version in pyproject.toml")
          if runpy.run_path("src/magma_core/__init__.py")["__version__"] != version:
              raise SystemExit("magma_core.__version__ must match pyproject.toml")
          PY
      - name: Build and check package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check installed wheel outside the checkout
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -I - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          import magma_core

          assert magma_core.__version__ == version("magma_core")
          assert files("magma_core").joinpath("configs/default_config.yaml").is_file()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/magma-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
