[project]
name = "magma_core"
version = "2.0.0b1"
description = "Core abstractions and protocols for MAGMA"
readme = "README.md"
# First beta supports the Python minor version used for installation validation.
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8,<3",
    "requests>=2.34.2,<3",
    "PyYAML>=6.0.3,<7",
    "pydantic>=2.4,<3",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
interface = []
simulation = [
    "mani_skill==3.0.1",
    "sapien==3.0.3",
    "numpy==1.26.4",
    "gymnasium==1.3.0",
    "transforms3d==0.4.2",
]
all = ["magma_core[simulation]"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"magma_core.configs" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_ros"
testpaths = ["tests"]
